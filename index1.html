    <style>
        /* ------------------------------------- */
        /* CSS: Stile e Adattamento Immagini */
        /* ------------------------------------- */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Header e Footer */
        .header, .footer {
            padding: 15px 20px;
            background-color: #333;
            color: white;
            text-align: center;
        }

        .header {
            border-bottom: 3px solid #FFFFFF;
                        /* Abilita Flexbox */
            display: flex; 
            /* Allinea orizzontalmente: CENTRA IL CONTENUTO */
            justify-content: center; 
            /* Allinea verticalmente (se c'è spazio) */
            align-items: center; 
        }

        .logo h1 {
            margin: 0;
            font-size: 1.5em;
        }

        .footer {
            font-size: 0.8em;
            position: fixed;
            bottom: 0;
            width: 100%;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        /* Contenitore Carosello */
        .carousel-container {
            position: relative;
            max-width: 90vw; 
            height: 80vh;    /* Altezza del carosello */
            margin: 70px auto 60px; /* Spazio per header, footer e pulsante autoplay */
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            background-color: #000; /* Sfondo nero per le zone "vuote" */
        }

        /* Traccia delle Immagini */
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            height: 100%;
        }

        /* Stile Immagine (Tutta Visibile) */
        .carousel-slide {
            min-width: 100%; 
            height: 100%;
            display: flex;
            justify-content: center; /* Centra orizzontalmente */
            align-items: center;     /* Centra verticalmente */
            flex-shrink: 0; 
        }

        .carousel-slide img {
            /* NUOVO: L'immagine è scalata per essere interamente visibile */
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
        }

        /* Frecce e Pulsante di Controllo */
        .arrow, .toggle-btn {
            position: absolute;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.3s, background 0.3s;
        }

        .arrow:hover, .toggle-btn:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.8);
        }
        
        /* Frecce */
        .arrow {
            top: 50%;
            transform: translateY(-50%);
            padding: 15px;
            font-size: 24px;
            border-radius: 4px;
        }

        .prev { left: 10px; }
        .next { right: 10px; }

        /* Pulsante Stop/Play (Sempre Visibile) */
        .toggle-btn {
            top: 10px;
            right: 10px;
            padding: 8px 12px;
            font-size: 18px;
            border-radius: 4px;
            background-color: #007bff; 
            opacity: 1;
        }
    </style>
</head>

        const imageDir = 'WhatsApp Unknown 2025-10-22 at 12.32.10/'; 
        const carouselTrack = document.getElementById('carouselTrack');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const toggleAutoplayBtn = document.getElementById('toggleAutoplay');
        const toggleIcon = document.getElementById('toggleIcon');
        const currentYearSpan = document.getElementById('currentYear');

        let currentIndex = 0;
        let autoplayInterval;
        let isPlaying = true;
        const autoplayDelay = 3000; // 3 secondi per slide

        // 1. Caricamento Immagini
        function loadImages() {
            if (imageFiles.length === 0) {
                carouselTrack.innerHTML = '<div style="text-align:center; padding-top: 30vh; font-size: 1.2em; color: white;">Attenzione: Array "imageFiles" vuoto o nomi non corretti.</div>';
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                toggleAutoplayBtn.style.display = 'none';
                return;
            }
            
            imageFiles.forEach(fileName => {
                const slide = document.createElement('div');
                slide.classList.add('carousel-slide');
                
                const img = document.createElement('img');
                img.src = `${imageDir}${fileName}`;
                img.alt = `Slide ${fileName}`;
                
                slide.appendChild(img);
                carouselTrack.appendChild(slide);
            });
        }

        // 2. Funzione per spostare il carosello
        function moveToSlide(index) {
            if (imageFiles.length === 0) return; // Non fare nulla se non ci sono immagini
            
            // Ciclo infinito
            if (index >= imageFiles.length) {
                currentIndex = 0;
            } else if (index < 0) {
                currentIndex = imageFiles.length - 1;
            } else {
                currentIndex = index;
            }
            
            // Applica la trasformazione CSS per lo scorrimento
            const offset = -currentIndex * 100;
            carouselTrack.style.transform = `translateX(${offset}%)`;
        }

        // 3. Controllo Autoplay
        function startAutoplay() {
            if (imageFiles.length <= 1) return; 
            isPlaying = true;
            toggleIcon.innerHTML = '&#9616;&#9616;'; // Icona Pausa
            autoplayInterval = setInterval(() => {
                moveToSlide(currentIndex + 1);
            }, autoplayDelay);
        }

        function stopAutoplay() {
            isPlaying = false;
            toggleIcon.innerHTML = '&#9658;'; // Icona Play
            clearInterval(autoplayInterval);
        }

        // 4. Gestione Eventi (Frecce e Pulsante)
        prevBtn.addEventListener('click', () => {
            stopAutoplay();
            moveToSlide(currentIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
            stopAutoplay();
            moveToSlide(currentIndex + 1);
        });

        toggleAutoplayBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopAutoplay();
            } else {
                startAutoplay();
            }
        });

        // 5. Inizializzazione
        document.addEventListener('DOMContentLoaded', () => {
            currentYearSpan.textContent = new Date().getFullYear();
            
            loadImages();
            if (imageFiles.length > 0) {
                startAutoplay();
            }
        });
