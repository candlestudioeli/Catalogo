<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carosello Immagini GitHub</title>
    
    <style>
        /* ------------------------------------- */
        /* CSS: Stile e Adattamento Immagini */
        /* ------------------------------------- */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Header e Footer */
        .header, .footer {
            padding: 15px 20px;
            background-color: #333;
            color: white;
            text-align: center;
        }

        .header {
            border-bottom: 3px solid #007bff;
        }

        .logo h1 {
            margin: 0;
            font-size: 1.5em;
        }

        .footer {
            font-size: 0.8em;
            position: fixed;
            bottom: 0;
            width: 100%;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        /* Contenitore Carosello */
        .carousel-container {
            position: relative;
            max-width: 90vw; /* Larghezza massima viewport */
            height: 70vh;    /* Altezza massima per adattarsi alla pagina */
            margin: 80px auto 100px; /* Spazio per header e footer */
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            background-color: #fff;
        }

        /* Traccia delle Immagini */
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            height: 100%;
        }

        /* Stile Immagine (Adattamento Pagina) */
        .carousel-slide {
            min-width: 100%; /* Ogni slide occupa tutta la larghezza del contenitore */
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0; /* Impedisce la riduzione della larghezza */
        }

        .carousel-slide img {
            /* Proprietà chiave per l'adattamento */
            width: 100%;
            height: 100%;
            object-fit: contain; /* Adatta l'immagine mantenendo le proporzioni */
            display: block;
        }

        /* Frecce e Pulsante di Controllo */
        .arrow, .toggle-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 15px;
            cursor: pointer;
            z-index: 10;
            font-size: 24px;
            opacity: 0.8;
            transition: opacity 0.3s;
            border-radius: 4px;
        }

        .arrow:hover, .toggle-btn:hover {
            opacity: 1;
        }

        .prev { left: 10px; }
        .next { right: 10px; }

        .toggle-btn {
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 15px;
            font-size: 18px;
            /* Posiziona il pulsante Stop/Play sotto il carosello */
            top: calc(100% + 40px); 
            border-radius: 50px;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <img src="Gemini_Generated_Image_df10mzdf10mzdf10.png" alt="Logo Aziendale">
       </div>
        </header>

    <div class="carousel-container">
        
        <div class="carousel-track" id="carouselTrack">
            </div>

        <button class="arrow prev" id="prevBtn" title="Precedente">&#10094;</button>
        <button class="arrow next" id="nextBtn" title="Successiva">&#10095;</button>

        <button class="toggle-btn" id="toggleAutoplay" title="Controlla Autoplay">
            <span id="toggleIcon">&#9616;&#9616;</span> </button>
    </div>

    <footer class="footer">
        <p>&copy; <span id="currentYear"></span> Candle Studio Eli </p>
    </footer>

    <script>
        // -------------------------------------
        // JAVASCRIPT: Logica Carosello
        // -------------------------------------

        // **************** ATTENZIONE ****************
        // DEVI AGGIORNARE QUESTO ARRAY con i nomi esatti dei file
        // che hai caricato nella cartella 'immagini/' del tuo repo.
        const imageFiles = [
            'foto1.jpg',
            'image_due.png',
            'terza-foto.gif',
            'quarta.jpeg'
            // Aggiungi qui tutti i nomi dei tuoi file...
        ];
        
        const imageDir = 'immagini/'; // La cartella sul tuo repo GitHub
        const carouselTrack = document.getElementById('carouselTrack');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const toggleAutoplayBtn = document.getElementById('toggleAutoplay');
        const toggleIcon = document.getElementById('toggleIcon');
        const currentYearSpan = document.getElementById('currentYear');

        let currentIndex = 0;
        let autoplayInterval;
        let isPlaying = true;
        const autoplayDelay = 5000; // 3 secondi per slide

        // 1. Caricamento Immagini
        function loadImages() {
            if (imageFiles.length === 0) {
                // Messaggio di errore se l'array è vuoto
                carouselTrack.innerHTML = '<div style="text-align:center; padding-top: 30vh; font-size: 1.2em;">Attenzione: L\'array "imageFiles" è vuoto o non contiene i nomi corretti.</div>';
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                toggleAutoplayBtn.style.display = 'none';
                return;
            }
            
            imageFiles.forEach(fileName => {
                const slide = document.createElement('div');
                slide.classList.add('carousel-slide');
                
                const img = document.createElement('img');
                img.src = `${imageDir}${fileName}`;
                img.alt = `Slide ${fileName}`;
                
                slide.appendChild(img);
                carouselTrack.appendChild(slide);
            });
        }

        // 2. Funzione per spostare il carosello
        function moveToSlide(index) {
            // Ciclo infinito: torna all'inizio o alla fine
            if (index >= imageFiles.length) {
                currentIndex = 0;
            } else if (index < 0) {
                currentIndex = imageFiles.length - 1;
            } else {
                currentIndex = index;
            }
            
            // Applica la trasformazione CSS per lo scorrimento
            const offset = -currentIndex * 100;
            carouselTrack.style.transform = `translateX(${offset}%)`;
        }

        // 3. Controllo Autoplay
        function startAutoplay() {
            if (imageFiles.length <= 1) return; // Non avviare se c'è solo una foto
            isPlaying = true;
            toggleIcon.innerHTML = '&#9616;&#9616;'; // Icona Pausa
            autoplayInterval = setInterval(() => {
                moveToSlide(currentIndex + 1);
            }, autoplayDelay);
        }

        function stopAutoplay() {
            isPlaying = false;
            toggleIcon.innerHTML = '&#9658;'; // Icona Play
            clearInterval(autoplayInterval);
        }

        // 4. Gestione Eventi (Frecce e Pulsante)
        prevBtn.addEventListener('click', () => {
            stopAutoplay();
            moveToSlide(currentIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
            stopAutoplay();
            moveToSlide(currentIndex + 1);
        });

        toggleAutoplayBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopAutoplay();
            } else {
                startAutoplay();
            }
        });

        // 5. Inizializzazione all'avvio della pagina
        document.addEventListener('DOMContentLoaded', () => {
            // Aggiorna l'anno nel footer
            currentYearSpan.textContent = new Date().getFullYear();
            
            loadImages();
            if (imageFiles.length > 0) {
                startAutoplay();
            }
        });
    </script>
</body>
</html>
