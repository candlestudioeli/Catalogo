    <style>
        /* === CSS: Sfondo e Stile di Base === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            /* NUOVO SFONDO CON GRADIENTE ACCATTIVANTE */
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%); 
        }

        header {
            background-color: #FFFFFF;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .logo-container img {
            height: 90px;
            width: auto;
            display: block;
        }

        /* =================================================== */
        /* === CSS PER LO SLIDER (CAROUSEL) === */
        /* =================================================== */

        .slider-container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
            position: relative;
            overflow: hidden;
            border: 5px solid #007bff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            border-radius: 12px;
        }

        .slide-track {
            display: flex;
            transition: transform 0.6s ease-in-out;
        }

        .slide {
            min-width: 100%; 
            box-sizing: border-box; 
            text-align: center;
        }

        .slide figure {
            margin: 0;
            padding: 0;
            background-color: #fff;
            width: 100%;
            border: none;
            box-shadow: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
        }
        
        /* INGRANDIMENTO IMMAGINE */
        .slide img {
            width: 100%;
            height: 550px; /* ALTEZZA AUMENTATA PER IMMAGINE PIÙ GRANDE */
            object-fit: cover;
            display: block;
            border-radius: 0;
        }

        /* Didascalia (Descrizione) */
        .slide figcaption {
            padding: 18px;
            background-color: #007bff;
            color: white;
            font-size: 1.3em;
            font-weight: 500;
            text-align: center;
        }
        
        /* === CSS: Navigazione Manuale (Frecce) === */
        .nav-btn {
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            padding: 12px 18px;
            color: white;
            font-size: 26px;
            transition: 0.3s ease;
            user-select: none;
            background-color: rgba(0, 0, 0, 0.4);
            border: none;
            z-index: 10;
        }

        .prev { left: 0; border-radius: 0 4px 4px 0; }
        .next { right: 0; border-radius: 4px 0 0 4px; }

        .nav-btn:hover { background-color: rgba(0, 0, 0, 0.7); }
        
        /* === CSS: Tasto Pausa === */
        .pause-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            padding: 8px 15px;
            background-color: rgba(255, 255, 255, 0.7);
            color: #333;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .pause-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }

        /* === CSS: Footer === */
        footer {
            background-color: #FFFFFF;
            color: #333;
            text-align: center;
            padding: 20px 0;
            font-size: 0.9em;
            border-top: 1px solid #ddd;
            margin-top: 40px;
        }
    </style>
</head>

    <script>
        /* === JAVASCRIPT: Logica di Scorrimento (Autoplay 4s e Manuale) === */

        const track = document.querySelector('.slide-track');
        const slides = document.querySelectorAll('.slide');
        const pauseButton = document.getElementById('pauseButton');
        
        let currentSlide = 0;
        const slideCount = slides.length;
        
        // Autoplay ogni 4 secondi (4000ms)
        const autoplayInterval = 4000; 
        
        let slideInterval; 
        let isAutoplaying = true;

        // 1. Sposta il carosello
        function showSlide() {
            const offset = -currentSlide * 100; 
            track.style.transform = `translateX(${offset}%)`;
        }

        // 2. Cambia slide (manuale)
        window.changeSlide = function(direction) {
            pauseAutoplay();
            
            currentSlide += direction;

            if (currentSlide >= slideCount) {
                currentSlide = 0;
            }
            if (currentSlide < 0) {
                currentSlide = slideCount - 1;
            }

            showSlide();

            if (isAutoplaying) {
                startAutoplay();
            }
        };

        // 3. Avvia l'Autoplay
        function startAutoplay() {
            if (!slideInterval) {
                slideInterval = setInterval(() => {
                    changeSlide(1); 
                }, autoplayInterval);
            }
        }

        // 4. Ferma l'Autoplay
        function pauseAutoplay() {
            clearInterval(slideInterval);
            slideInterval = null;
        }
        
        // 5. Toggla (Pausa/Riparti) tramite il pulsante
        window.toggleAutoplay = function() {
            if (isAutoplaying) {
                pauseAutoplay();
                isAutoplaying = false;
                pauseButton.textContent = "RIPARTI";
            } else {
                startAutoplay();
                isAutoplaying = true;
                pauseButton.textContent = "PAUSA";
            }
        };

        // 6. Avvio e gestione mouse-hover
        startAutoplay();
        
        const slider = document.getElementById('imageSlider');
        slider.addEventListener('mouseenter', pauseAutoplay);
        slider.addEventListener('mouseleave', () => {
            if (isAutoplaying) {
                startAutoplay();
            }
        });
        
        // Inizializza l'anno nel footer
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
