    <meta charset="UTF-8">

    <title>Slider Prodotti - Candle Studio Eli</title>
    
    <style>
        /* === CSS: Sfondo e Stile di Base === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            /* NUOVA IMMAGINE DI SFONDO PER L'INTERO BODY */
            background-image: url('immagini/sfondo_candela.jpg'); /* INSERISCI QUI IL PERCORSO DELLA TUA IMMAGINE */
            background-size: cover; /* L'immagine copre l'intera area */
            background-position: center center; /* Centra l'immagine */
            background-attachment: fixed; /* L'immagine rimane fissa durante lo scroll */
        }

        header {
            background-color: rgba(255, 255, 255, 0.85); /* Sfondo leggermente trasparente per farlo risaltare */
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .logo-container img {
            height: 90px;
            width: auto;
            display: block;
        }

        /* =================================================== */
        /* === CSS PER LO SLIDER (CAROUSEL) === */
        /* =================================================== */

        .slider-container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
            position: relative;
            overflow: hidden;
            border: 5px solid #007bff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.95); /* Sfondo quasi opaco per lo slider */
        }

        .slide-track {
            display: flex;
            transition: transform 0.6s ease-in-out;
        }

        .slide {
            min-width: 100%; 
            box-sizing: border-box; 
            text-align: center;
        }

        .slide figure {
            margin: 0;
            padding: 0;
            background-color: transparent; /* Sfondo della figura trasparente, usa quello dello slider */
            width: 100%;
            border: none;
            box-shadow: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
        }
        
        /* INGRANDIMENTO IMMAGINE DELLO SLIDER */
        .slide img {
            width: 100%;
            height: 550px;
            object-fit: cover;
            display: block;
            border-radius: 0;
        }

        /* Didascalia (Descrizione) */
        .slide figcaption {
            padding: 18px;
            background-color: #007bff;
            color: white;
            font-size: 1.3em;
            font-weight: 500;
            text-align: center;
        }
        
        /* === CSS: Navigazione Manuale (Frecce) === */
        .nav-btn {
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            padding: 12px 18px;
            color: white;
            font-size: 26px;
            transition: 0.3s ease;
            user-select: none;
            background-color: rgba(0, 0, 0, 0.4);
            border: none;
            z-index: 10;
        }

        .prev { left: 0; border-radius: 0 4px 4px 0; }
        .next { right: 0; border-radius: 4px 0 0 4px; }

        .nav-btn:hover { background-color: rgba(0, 0, 0, 0.7); }
        
        /* === CSS: Tasto Pausa === */
        .pause-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            padding: 8px 15px;
            background-color: rgba(255, 255, 255, 0.7);
            color: #333;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .pause-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }

        /* === CSS: Footer === */
        footer {
            background-color: rgba(255, 255, 255, 0.85); /* Sfondo leggermente trasparente */
            color: #333;
            text-align: center;
            padding: 20px 0;
            font-size: 0.9em;
            border-top: 1px solid #ddd;
            margin-top: 40px;
        }
    </style>
