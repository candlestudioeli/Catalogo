<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Prodotti - Candle Studio Eli</title>
    
    <style>
        /* === CSS: Stile di Base e Header === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #FFFFFF;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .logo-container img {
            height: 90px;
            width: auto;
            display: block;
        }

        /* =================================================== */
        /* === CSS PER LO SLIDER (CAROUSEL) === */
        /* =================================================== */

        .slider-container {
            /* Area visibile (centrata) */
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            position: relative;
            overflow: hidden;
            border: 5px solid #007bff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        .slide-track {
            /* Contenitore di tutte le slide affiancate */
            display: flex;
            transition: transform 0.6s ease-in-out; /* Animazione di scorrimento */
        }

        .slide {
            /* Ogni slide occupa il 100% della larghezza visibile */
            min-width: 100%; 
            box-sizing: border-box; 
            text-align: center;
        }

        /* Figura e Immagine */
        .slide figure {
            margin: 0;
            padding: 0;
            background-color: #fff;
            width: 100%;
            border: none;
            box-shadow: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
        }
        
        .slide img {
            width: 100%;
            height: 450px; /* Altezza fissa */
            object-fit: cover;
            display: block;
            border-radius: 0;
        }

        /* Didascalia e Prezzo */
        .slide figcaption {
            padding: 15px;
            background-color: #007bff;
            color: white;
            font-size: 1.2em;
            font-weight: 500;
            text-align: center;
        }
        
        .slide figcaption strong {
            font-size: 1.1em;
            color: #FFEB3B; /* Giallo brillante per il prezzo */
            margin-left: 10px;
        }

        /* === CSS: Navigazione Manuale (Frecce) === */
        .nav-btn {
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            padding: 10px 15px;
            color: white;
            font-size: 24px;
            transition: 0.3s ease;
            user-select: none;
            background-color: rgba(0, 0, 0, 0.4);
            border: none;
            z-index: 10;
        }

        .prev { left: 0; border-radius: 0 4px 4px 0; }
        .next { right: 0; border-radius: 4px 0 0 4px; }

        .nav-btn:hover { background-color: rgba(0, 0, 0, 0.7); }
        
        /* === CSS: Tasto Pausa === */
        .pause-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            padding: 8px 15px;
            background-color: rgba(255, 255, 255, 0.7);
            color: #333;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .pause-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }

        /* === CSS: Footer === */
        footer {
            background-color: #FFFFFF;
            color: #333;
            text-align: center;
            padding: 20px 0;
            font-size: 0.9em;
            border-top: 1px solid #ddd;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="Gemini_Generated_Image_df10mzdf10mzdf10.png" alt="Candle Studio Eli Logo">
        </div>
    </header>

    <main>
        
        <div class="slider-container" id="imageSlider">
            
            <button class="pause-btn" id="pauseButton" onclick="toggleAutoplay()">PAUSA</button>

            <button class="nav-btn prev" onclick="changeSlide(-1)">&#10094;</button>
            
            <div class="slide-track">
                
                <div class="slide">
                    <figure> 
                        <img src="WhatsApp Unknown 2025-10-22 at 12.32.10/WhatsApp Image 2025-10-22 at 13.19.36 (1).jpeg" alt="Bomboniere Leoncino">
                        <figcaption>Bomboniera Leoncino <strong>10€</strong></figcaption>
                    </figure>
                </div>
                
                <div class="slide">
                    <figure>
                        <img src="WhatsApp Unknown 2025-10-22 at 12.32.10/WhatsApp Image 2025-10-22 at 11.33.14 (4).jpeg" alt="Piccolo Miracolo Candela">
                        <figcaption>Piccolo Miracolo <strong>7€</strong></figcaption>
                    </figure>
                </div>
                
                <div class="slide">
                    <figure>
                        <img src="WhatsApp Unknown 2025-10-22 at 12.32.10/WhatsApp Image 2025-10-22 at 11.33.14 (5).jpeg" alt="Margherita a Cono">
                        <figcaption>Margherita a Cono <strong>6€</strong></figcaption>
                    </figure>
                </div>

                <div class="slide">
                    <figure>
                        <img src="WhatsApp Unknown 2025-10-22 at 12.32.10/WhatsApp Image 2025-10-22 at 11.33.14 (25).jpeg" alt="Teddy con Cuore Candela">
                        <figcaption>Teddy con Cuore <strong>7€</strong></figcaption>
                    </figure>
                </div>

                <div class="slide">
                    <figure>
                        <img src="WhatsApp Unknown 2025-10-22 at 12.32.10/WhatsApp Image 2025-10-22 at 11.33.13.jpeg" alt="Tris di Zucche Autunnali">
                        <figcaption>Tris di Zucche <strong>10€</strong></figcaption>
                    </figure>
                </div>

                <div class="slide">
                    <figure>
                        <img src="WhatsApp Unknown 2025-10-22 at 12.32.10/WhatsApp Image 2025-10-22 at 11.33.14 (34).jpeg" alt="Zucca e Magia Candela">
                        <figcaption>Zucca e Magia <strong>15€</strong></figcaption>
                    </figure>
                </div>
                
                <div class="slide">
                    <figure>
                        <img src="WhatsApp Unknown 2025-10-22 at 12.32.10/WhatsApp Image 2025-10-22 at 11.33.14 (2).jpeg" alt="Incanto d'Autunno">
                        <figcaption>Incanto d'Autunno <strong>25€</strong></figcaption>
                    </figure>
                </div>
                
                </div>

            <button class="nav-btn next" onclick="changeSlide(1)">&#10095;</button>

        </div>
        </main>

    <footer>
        <span>© <span id="year"></span> Candle Studio Eli | Tutti i diritti riservati</span>
    </footer>

    <script>
        /* === JAVASCRIPT: Logica di Scorrimento (Autoplay 4s e Manuale) === */

        const track = document.querySelector('.slide-track');
        const slides = document.querySelectorAll('.slide');
        const pauseButton = document.getElementById('pauseButton');
        
        let currentSlide = 0;
        const slideCount = slides.length;
        
        // Autoplay ogni 4 secondi (4000ms)
        const autoplayInterval = 4000; 
        
        let slideInterval; 
        let isAutoplaying = true; // Stato iniziale: Autoplay attivo

        // 1. Funzione per spostare il carosello
        function showSlide() {
            const offset = -currentSlide * 100; 
            track.style.transform = `translateX(${offset}%)`;
        }

        // 2. Funzione per cambiare slide (manuale)
        window.changeSlide = function(direction) {
            // Metti in pausa l'autoplay temporaneamente per evitare salti
            pauseAutoplay();
            
            currentSlide += direction;

            // Logica di Loop: torna alla prima se superi l'ultima e viceversa
            if (currentSlide >= slideCount) {
                currentSlide = 0;
            }
            if (currentSlide < 0) {
                currentSlide = slideCount - 1;
            }

            showSlide();

            // Dopo l'interazione manuale, riavvia l'autoplay solo se lo stato era 'attivo'
            if (isAutoplaying) {
                startAutoplay();
            }
        };

        // 3. Funzione per avviare l'Autoplay
        function startAutoplay() {
            if (!slideInterval) {
                slideInterval = setInterval(() => {
                    changeSlide(1); 
                }, autoplayInterval);
            }
        }

        // 4. Funzione per fermare l'Autoplay
        function pauseAutoplay() {
            clearInterval(slideInterval);
            slideInterval = null;
        }
        
        // 5. Funzione per Toggolare (Pausa/Riparti) tramite il pulsante
        window.toggleAutoplay = function() {
            if (isAutoplaying) {
                pauseAutoplay();
                isAutoplaying = false;
                pauseButton.textContent = "RIPARTI";
            } else {
                startAutoplay();
                isAutoplaying = true;
                pauseButton.textContent = "PAUSA";
            }
        };

        // 6. Avvio e interazione (gestione mouse-hover)
        startAutoplay();
        
        const slider = document.getElementById('imageSlider');
        // Pausa l'autoplay quando il mouse entra, solo se l'autoplay era attivo
        slider.addEventListener('mouseenter', pauseAutoplay);
        // Riavvia quando il mouse esce, solo se l'autoplay era attivo
        slider.addEventListener('mouseleave', () => {
            if (isAutoplaying) {
                startAutoplay();
            }
        });
        
        // Inizializza l'anno nel footer
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
