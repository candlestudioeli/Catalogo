<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Automatico e Manuale</title>
    
    <style>
        /* ================= */
        /* === 1. CSS base per lo Slider === */
        /* ================= */
        
        .slider-container {
            /* Imposta l'area visibile */
            width: 80%;
            max-width: 700px;
            margin: 50px auto;
            position: relative;
            overflow: hidden; /* Nasconde le immagini fuori campo */
            border: 1px solid #ddd;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .slide-track {
            /* Il contenitore di tutte le slide, lungo abbastanza per contenerle */
            display: flex;
            transition: transform 0.5s ease-in-out; /* Animazione di scorrimento */
        }

        .slide {
            /* Ogni slide occupa il 100% della larghezza del contenitore */
            min-width: 100%; 
            box-sizing: border-box; 
            text-align: center;
        }

        .slide img {
            /* L'immagine occupa tutta la larghezza dello slide */
            width: 100%;
            height: auto;
            display: block;
        }

        .slide figcaption {
            /* Stile per la didascalia (nome immagine) */
            padding: 10px;
            background-color: #f8f8f8;
            color: #333;
            font-size: 1.1em;
            font-weight: bold;
        }

        /* =============================== */
        /* === 2. CSS per la Navigazione === */
        /* =============================== */

        .nav-btn {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: 0.3s ease;
            user-select: none;
            background-color: rgba(0, 0, 0, 0.5);
            border: none;
            z-index: 10;
        }

        .prev {
            left: 0;
            border-radius: 0 3px 3px 0;
        }

        .next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }

        .nav-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

        <button class="nav-btn prev" onclick="changeSlide(-1)">&#10094;</button>
        
        <div class="slide-track">

                <figcaption>Veduta Cittadina</figcaption>
            </figure>

            <figure class="slide">
                <img src="WhatsApp Unknown 2025-10-22 at 12.32.10/WhatsApp Image 2025-10-22 at 11.33.14 (5).jpeg" alt="Descrizione Immagine 3">
                <figcaption>Ritratti Artistici</figcaption>
            </figure>
            
            </div>

        <button class="nav-btn next" onclick="changeSlide(1)">&#10095;</button>

    </div>

        function showSlide() {

            const offset = -currentSlide * 100;
            // Applica la trasformazione CSS per spostare la "pista"
            track.style.transform = `translateX(${offset}%)`;
